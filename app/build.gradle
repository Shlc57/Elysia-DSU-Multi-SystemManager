plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
}

android {
    namespace "dev.multisystem.client"
    compileSdk 37

    defaultConfig {
        applicationId "dev.multisystem.client"
        minSdk 30
        targetSdk 35
        versionCode 22
        versionName "0.2.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        elysiaDebug {
            storeFile rootProject.file(".sign/elysia-debug.jks")
            storePassword "android"
            keyAlias "elysia-debug"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.elysiaDebug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    sourceSets.main.assets.srcDir rootProject.file("build/license-assets")
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2026.09.00")
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.material3:material3:1.5.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.11.0"
    implementation "top.yukonga.miuix.kmp:miuix-ui-android:0.9.4"
    implementation "top.yukonga.miuix.kmp:miuix-preference-android:0.9.4"
    implementation "top.yukonga.miuix.kmp:miuix-nav-android:0.9.4"
    implementation "com.materialkolor:material-kolor:5.0.1"
    implementation "io.github.kyant0:capsule:2.1.3"
    implementation "io.github.kyant0:backdrop:1.0.6"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    testImplementation "junit:junit:4.13.2"
}

tasks.register("prepareLicenseAssets", Copy) {
    from(rootProject.projectDir) { include "LICENSE", "LICENSE-GPL-2.0", "LICENSE-GPL-3.0", "THIRD_PARTY_NOTICES.md" }
    into rootProject.layout.buildDirectory.dir("license-assets")
}
tasks.named("preBuild") { dependsOn "prepareLicenseAssets" }
